# SPDX-License-Identifier: MIT

description: Hold-tap that resolves to its tap binding on pointer movement

compatible: "modula,behavior-pointer-hold-tap"

include: two_param.yaml

properties:
  bindings:
    type: phandles
    required: true
  tapping-term-ms:
    type: int
    required: true
  quick-tap-ms:
    type: int
    default: -1
  require-prior-idle-ms:
    type: int
    default: -1
  flavor:
    type: string
    default: "hold-preferred"
    enum:
      - "hold-preferred"
      - "balanced"
      - "tap-preferred"
      - "tap-unless-interrupted"
  hold-while-undecided:
    type: boolean
