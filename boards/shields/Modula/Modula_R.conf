# ===================================================
# Global Locality Behaviors
# ===================================================
# - RGB underglow
# - Backlight
# - Power management
# - Soft off
# see: https://v0-3-branch.zmk.dev/docs/features/split-keyboards#global-locality-behaviors

# ---------------------------------------------------
# Backlight configuration
# ---------------------------------------------------
# CONFIG_ZMK_BACKLIGHT=y

# ===================================================
# Split Keyboards Behaviors
# ===================================================

# ---------------------------------------------------
# Central configuration
# ---------------------------------------------------
CONFIG_ZMK_KEYBOARD_NAME="Modula"
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=1

# ---------------------------------------------------
# Basic configuration
# ---------------------------------------------------
CONFIG_GPIO=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12

CONFIG_NFCT_PINS_AS_GPIOS=y

# ---------------------------------------------------
# EC11 (ToDo: must be moved to module/snippet)
# ---------------------------------------------------
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
# CONFIG_EC11_TRIGGER_OWN_THREAD=y
# CONFIG_EC11_THREAD_PRIORITY=5
# CONFIG_EC11_THREAD_STACK_SIZE=2048

# ---------------------------------------------------
# Power management (still have smoe bug 2026/03/30)
# ---------------------------------------------------
# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_TIMEOUT=30000
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# ---------------------------------------------------
# Battery reporting
# ---------------------------------------------------
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# ---------------------------------------------------
# RGB LED widget configuration
# ---------------------------------------------------
CONFIG_RGBLED_WIDGET=y
# CONFIG_RGBLED_WIDGET_CONN_BLINK_MS=750
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10
# CONFIG_RGBLED_WIDGET_BATTERY_SHOW_PERIPHERALS=y
CONFIG_RGBLED_WIDGET_BATTERY_SHOW_SELF=y
CONFIG_RGBLED_WIDGET_LAYER_COLOR=7
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=y
CONFIG_RGBLED_WIDGET_LAYER_0_COLOR=0
CONFIG_RGBLED_WIDGET_LAYER_1_COLOR=6
CONFIG_RGBLED_WIDGET_LAYER_2_COLOR=2
CONFIG_RGBLED_WIDGET_LAYER_3_COLOR=5
CONFIG_RGBLED_WIDGET_LAYER_4_COLOR=4
CONFIG_RGBLED_WIDGET_LAYER_5_COLOR=3

# ---------------------------------------------------
# Experimental
# ---------------------------------------------------
# CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_CTLR_PHY_2M=n
# CONFIG_CHARGE_INDICATOR=y
# CONFIG_LAYOUT_SHIFT_TARGET_JIS=y
